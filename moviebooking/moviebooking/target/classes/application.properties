spring.application.name=moviebooking
spring.datasource.url=jdbc:mysql://localhost:3306/movie_booking
spring.datasource.username=root
spring.datasource.password=Venki@374757

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8081
server.error.include-message=always
server.error.include-binding-errors=always

# OMDb (Open Movie Database) API key.
# Kept in configuration rather than hardcoded in Java source.
# Override with the OMDB_API_KEY environment variable if this
# project is ever pushed to a public repository.
omdb.api.key=${OMDB_API_KEY:a2a2b93f}

# Email (booking confirmation) configuration.
# Credentials come from environment variables ONLY - never
# hardcoded here. If MAIL_USERNAME/MAIL_PASSWORD are not set,
# email sending is skipped gracefully (booking still succeeds).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000